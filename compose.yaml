services:
  triage:
    build: .
    image: imap-log-triage:local
    restart: unless-stopped
    init: true
#    env_file: .env
    environment:
      DATA_DIR: /data
      RULES_FILE: /app/config/rules.json
      IMAP_PASSWORD_FILE: /run/secrets/imap_password
      TZ: Europe/Zurich
    secrets:
      - imap_password
    volumes:
      - triage-data:/data
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -m, logtriage, health]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  triage-data:

secrets:
  imap_password:
    file: ./secrets/imap_password.txt
