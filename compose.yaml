services:
  triage:
    build:
      context: .
      dockerfile: Dockerfile
    image: imap-log-triage:local
    pull_policy: build
    restart: unless-stopped
    init: true
    environment:
      IMAP_HOST: ${IMAP_HOST:?Renseigne IMAP_HOST dans les variables de la stack}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:?Renseigne IMAP_USER dans les variables de la stack}
      IMAP_PASSWORD: ${IMAP_PASSWORD:?Renseigne IMAP_PASSWORD dans les variables de la stack}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      INITIAL_LOOKBACK_DAYS: ${INITIAL_LOOKBACK_DAYS:-30}
      POLL_SECONDS: ${POLL_SECONDS:-300}
      MAX_MESSAGES_PER_POLL: ${MAX_MESSAGES_PER_POLL:-500}
      MAX_MESSAGE_BYTES: ${MAX_MESSAGE_BYTES:-20971520}
      IMAP_TIMEOUT_SECONDS: ${IMAP_TIMEOUT_SECONDS:-45}
      DATA_DIR: /data
      RULES_FILE: /app/config/rules.json
      TZ: Europe/Zurich
      WEB_ENABLED: "true"
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-https://localhost:8448}
      WEB_TLS_NAMES: ${WEB_TLS_NAMES:-}
      WEB_USER: ${WEB_USER:-admin}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      REPORT_TO: ${REPORT_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_IMAP_CREDENTIALS: ${SMTP_USE_IMAP_CREDENTIALS:-false}
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8448}:8448"
    volumes:
      - triage-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -m, logtriage, health]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  triage-data:
